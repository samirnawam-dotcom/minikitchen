name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Browser smoke test (every page and Back Office tab)
        run: CHROMIUM_PATH="$(command -v google-chrome)" node --no-warnings test/e2e/smoke.js "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t minikitchen:ci .
      - name: Container starts and reports healthy
        run: |
          docker run -d --name mk -p 3000:3000 -e ADMIN_PASSWORD=ci-password-123 minikitchen:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 1
          done
          docker logs mk
          exit 1
