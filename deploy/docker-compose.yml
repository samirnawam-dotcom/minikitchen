# Production stack: the Node app behind Caddy (automatic HTTPS via Let's Encrypt).
# Run from this directory on the server: docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      TRUST_PROXY: '1'
    volumes:
      - ./data:/app/data
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
